# The design doc's "clean initial experiment": 3 team sizes x 3 diversity levels x
# 2 communication conditions (independent vote vs the one-round horizontal protocol).
# Strong diversity uses occupational roles; with N = 3 the roles are solver, critic and
# alternative-hypothesis generator unless overridden below.

[experiment]
name = "full-factorial"
seed = 20261004
replications = 3

[benchmarks.musique]
items = 300
budget_tokens = 70000

[benchmarks.musr]
items = 300
budget_tokens = 55000

[benchmarks.humaneval]
budget_tokens = 45000

[factors]
team_size = [1, 3, 5]
diversity = ["identical", "moderate", "strong"]
communication = ["independent", "horizontal"]
model_assignment = ["homogeneous"]

# Example of overriding a level for one team size (keeps the integrator in 3-person teams).
[diversity.strong]
by_team_size = { 3 = ["solver", "critic", "integrator"] }

[generation]
temperature = 0.7

[models.base]
provider = "openai"
model = "gpt-6-luna"
params = { reasoning_effort = "none" }
concurrency = 16

[model_assignments.homogeneous]
models = ["base"]

[run]
trial_concurrency = 12
max_spend_usd = 250.0
