# Pilot of the design doc's "first experiment": N = 1, 3, 5 x identical vs moderate procedures
# x independent vote vs two-round horizontal discussion, on MuSiQue, MuSR and HumanEval.
#
#   uv run workforce run configs/pilot.toml --env-file /path/to/.env
#
# 20 items per benchmark, 1 replication, 10 conditions (N = 1 is never "moderately diverse").

[experiment]
name = "pilot"
seed = 20261004
replications = 1
description = "First-experiment pilot: ~20 items per benchmark, 1 replication."

# Budgets are total (input + output) team tokens per problem. They are sized so the largest
# condition (N = 5, two rounds) still gets about 600 output tokens per call on a typical item
# (see "Budget calibration" in the README).
[benchmarks.musique]
items = 20
budget_tokens = 100000

[benchmarks.musr]
items = 20
budget_tokens = 80000

[benchmarks.humaneval]
items = 20
budget_tokens = 65000

[factors]
team_size = [1, 3, 5]
diversity = ["identical", "moderate"]
communication = ["independent", "horizontal-2r"]
model_assignment = ["homogeneous"]

[generation]
temperature = 0.7
max_output_tokens_per_call = 8192
min_output_tokens = 200

[budget]
count = "total"
disclose_allowance = true

# gpt-6-luna with reasoning_effort = "none": the cheapest current OpenAI model; "none" keeps all
# reasoning visible (needed to validate the procedures) and allows temperature and seed.
[models.base]
provider = "openai"
model = "gpt-6-luna"
params = { reasoning_effort = "none" }
concurrency = 16

[model_assignments.homogeneous]
models = ["base"]

[run]
trial_concurrency = 12
max_spend_usd = 14.0
