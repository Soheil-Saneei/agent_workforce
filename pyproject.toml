[project]
name = "workforce"
version = "0.1.0"
description = "Experiment harness for teams of LLM agents under a fixed total token budget"
authors = [
    { name = "Soheil-Saneei", email = "soheilsaneei@gmail.com" }
]
requires-python = ">=3.11"
# httpx: one async HTTP client for every provider adapter and for dataset downloads.
# tiktoken: exact pre-call token counts so the per-problem budget is enforced before paying.
dependencies = [
    "httpx>=0.28.1",
    "tiktoken>=0.14.0",
]

[project.scripts]
workforce = "workforce.cli:main"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["workforce"]
known-local-folder = ["conftest", "helpers"]
